{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}URL Shortener — dvogiatz{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'shorty_app/css/style.css' %}" />
    </head>
    <body>
        <header class="site-header">
            <div class="header-inner">
                <a href="https://dvogiatz.com/" class="brand">
                    <span class="bracket" aria-hidden="true">&lt;/&gt;</span>
                    <span>dvogiatz</span>
                </a>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
